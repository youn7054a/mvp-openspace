name: Deploy static archive to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - archive/site/**
      - .github/workflows/deploy-static-archive.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload archive
        uses: actions/upload-pages-artifact@v3
        with:
          path: archive/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
